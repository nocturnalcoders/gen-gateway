# The gateway on its own: start this project first, then the ones behind it.
# It owns the docker network "gen-gateway"; the other projects join it as an external
# network and are reached by container name (see Caddyfile).
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_HOSTS: ${API_HOSTS:-api.invalid}
      CMS_HOST: ${CMS_HOST:-cms.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing this volume means requesting them again.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway

networks:
  gateway:
    name: gen-gateway

volumes:
  caddy_data:
  caddy_config:
